{% macro tier(t) %}<span class="tier tier-{{ t.id }}"><svg aria-hidden="true"><use href="#tier-{{ t.id }}"/></svg>{{ t.label }}</span>{% endmacro %}
{% macro install_box(id, args="") %}<div class="cmd"><code id="{{ id }}"><span>curl -fsSL</span> <span>{{ run_url }}</span> <span class="nowrap">| sh</span>{% if args %} <span>{{ args }}</span>{% endif %}</code><button class="cmd-copy" type="button" data-copy="#{{ id }}"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg><span class="copy-label">Copy</span></button><span class="sr-only" role="status"></span></div>{% endmacro %}
