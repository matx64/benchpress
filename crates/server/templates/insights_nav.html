<div class="insights-bar">
  <nav class="page-tabs" aria-label="Insights">
    <a href="/insights/memory"{% if path == "/insights/memory" %} aria-current="page"{% endif %}>Memory</a>
    <a href="/insights/cores"{% if path == "/insights/cores" %} aria-current="page"{% endif %}>Cores</a>
  </nav>
  <form class="filters" method="get" action="{{ path }}" data-auto>
    <label class="field">Suite
      <select name="suite">{% for s in suites %}<option value="{{ s.key }}"{% if s.key == suite.key %} selected{% endif %}>{{ s.label }}</option>{% endfor %}</select>
    </label>
    <button class="btn" type="submit">Apply</button>
  </form>
</div>
