[package]
name = "benchpress"
description = "Benchmark Rust compile times on your machine and compare with others"
readme = "../../README.md"
keywords = ["benchmark", "cargo", "compile-time", "hardware"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.105"
benchpress-core = { version = "0.1.0", path = "../core" }
clap = { version = "4.6.10", features = ["derive"] }
comfy-table = "8.0.1"
console = "0.16.6"
ctrlc = "3.5.3"
dialoguer = "0.12.0"
dirs = "7.0.0"
flate2 = "1.1.11"
hex = "0.4.3"
indicatif = "0.18.6"
libc = "0.2.191"
nix = { version = "0.32.0", features = ["resource", "signal", "process", "fs", "user", "feature"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
sysinfo = "0.40.4"
tar = "0.4.46"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.2", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo"] }

[dev-dependencies]
tempfile = "3.27.0"
