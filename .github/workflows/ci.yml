name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: shellcheck install.sh
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p benchpress --locked
      - name: Install from a local mirror
        run: |
          case "$(uname -s)" in
            Linux) target="$(uname -m)-unknown-linux-musl" ;;
            Darwin) target=aarch64-apple-darwin ;;
          esac
          mirror="$RUNNER_TEMP/mirror"
          mkdir -p "$mirror"
          tar -czf "$mirror/benchpress-$target.tar.gz" -C target/debug benchpress
          (cd "$mirror" && shasum -a 256 "benchpress-$target.tar.gz" > "benchpress-$target.tar.gz.sha256")
          BENCHPRESS_DOWNLOAD_URL="file://$mirror" BENCHPRESS_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh --version
          test -x "$RUNNER_TEMP/bin/benchpress"
          echo "0000 benchpress-$target.tar.gz" > "$mirror/benchpress-$target.tar.gz.sha256"
          if BENCHPRESS_DOWNLOAD_URL="file://$mirror" BENCHPRESS_INSTALL_DIR="$RUNNER_TEMP/bad" sh install.sh; then
            echo "installer accepted a bad checksum" >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/bad/benchpress"

  e2e:
    if: github.event_name != 'pull_request'
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BENCHPRESS_SERVER: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "BENCHPRESS_DATA_DIR=$RUNNER_TEMP/data" >> "$GITHUB_ENV"
          echo "BENCHPRESS_CACHE_DIR=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - name: Start the server
        run: |
          BENCHPRESS_DB="$RUNNER_TEMP/e2e.db" BENCHPRESS_BIND=127.0.0.1:8080 BENCHPRESS_PUBLIC_URL=http://127.0.0.1:8080 \
            ./target/debug/benchpress-server > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - name: Run the quick suite
        run: ./target/debug/benchpress run quick --yes --no-submit --cooldown 0
      - name: Submit and fetch the result page
        run: |
          result=$(ls "$BENCHPRESS_DATA_DIR"/results/*.json | grep -v submission | head -n 1)
          ./target/debug/benchpress submit "$result" --yes
          url=$(jq -r .url "${result%.json}.submission.json")
          curl -fsS "$url" | grep -q "Clean release"
          curl -fsS "$url/og.png" -o "$RUNNER_TEMP/og.png"
          file "$RUNNER_TEMP/og.png" | grep -q PNG
      - if: failure()
        run: cat "$RUNNER_TEMP/server.log"
