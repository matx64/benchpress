name: Suites

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to build (quick, standard or heavy)
        default: quick

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p benchpress --release --locked
      - run: ./target/release/benchpress run "${{ inputs.suite }}" --runs 1 --cooldown 0 --no-submit --yes
